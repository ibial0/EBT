version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      react:
        patterns: ['react', 'react-dom', 'react-router-dom']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
