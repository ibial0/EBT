<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ebt-logo.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/ebt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="EBT | multi-chain testnet bridge and swap platform. Testnet only." />
    <title>EBT | Overview</title>
    <!-- Theme before first paint: dark by default, the owner's stored choice wins. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('ebt.theme')
          var light = t === 'light'
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          document.documentElement.classList.toggle('dark', !light)
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
